events {
    worker_connections 1024;
}

http {

    upstream park_backend {
        server park-app:8080;
    }

    upstream users_backend {
        server users-service:8686;
    }

    server {
        listen 80;

        # Microservicio de usuarios - users-service:8686
        location /users/ {
            proxy_pass         http://users_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Authorization      $http_authorization;
            proxy_pass_header  Authorization;
        }

        # API principal de parqueo - park-app:8080
        location /api/ {
            proxy_pass         http://park_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Authorization      $http_authorization;
            proxy_pass_header  Authorization;
        }

        # Fallback
        location / {
            return 404 '{"error":"Not found"}';
            add_header Content-Type application/json;
        }
    }
}
