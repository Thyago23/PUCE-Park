name: CI Backend

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  park-app:
    name: park-app · build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Ejecutar pruebas (park-app)
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

  users-service:
    name: users-service · build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Ejecutar pruebas (users-service)
        working-directory: users-service
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon
