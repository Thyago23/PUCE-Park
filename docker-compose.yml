version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: puce_park_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: puce_park
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d puce_park"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: puce_park_backend
    ports:
      - "8080:8080"
    environment:
      # Sobreescribe la URL para apuntar al contenedor de base de datos
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/puce_park
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
