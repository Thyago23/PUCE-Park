version: '3.9'

services:

  # ── Base de datos 1: Parqueo principal ────────────────────────────────────────
  db_park:
    image: postgres:16-alpine
    container_name: puce_park_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: puce_park
    ports:
      - "5434:5432"
    volumes:
      - db_park_data:/var/lib/postgresql/data
    networks:
      - park_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d puce_park"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Base de datos 2: Microservicios ───────────────────────────────────────────
  db_micro:
    image: postgres:16-alpine
    container_name: puce_micro_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: puce_micro
    ports:
      - "5435:5432"
    volumes:
      - db_micro_data:/var/lib/postgresql/data
    networks:
      - park_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d puce_micro"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Aplicación Spring Boot principal ──────────────────────────────────────────
  park-app:
    build: .
    container_name: puce_park_backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db_park:5432/puce_park
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      db_park:
        condition: service_healthy
    networks:
      - park_net
    restart: unless-stopped

  # ── Nginx: reverse proxy + balanceo ───────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: puce_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - park-app
    networks:
      - park_net
    restart: unless-stopped

volumes:
  db_park_data:
  db_micro_data:

networks:
  park_net:
    driver: bridge
